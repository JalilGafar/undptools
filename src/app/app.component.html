<div id="app">
  <!-- Nouvelle version détectée : fenêtre au centre de l'écran, fond flouté, plus rien d'accessible tant qu'on n'a pas mis à jour -->
  @if (updateAvailable) {
    <div class="update-overlay" role="alertdialog" aria-modal="true" aria-labelledby="update-title" aria-describedby="update-text">
      <div class="update-card">
        <div class="update-icon"><i class="bi bi-arrow-repeat" [class.spin]="updating"></i></div>
        <h2 id="update-title" class="update-title">Nouvelle version disponible</h2>
        <p id="update-text" class="update-text">
          Pour continuer à utiliser la plateforme correctement, mettez-la à jour maintenant. La page va se recharger.
        </p>
        <button type="button" class="update-btn" (click)="applyUpdate()" [disabled]="updating" autofocus>
          @if (updating) { <span class="spinner-border spinner-border-sm me-2" aria-hidden="true"></span>Mise à jour en cours… }
          @else { <i class="bi bi-arrow-clockwise me-2"></i>Mettre à jour maintenant }
        </button>
        <p class="update-note">Si vous aviez une saisie en cours non enregistrée, elle sera perdue.</p>
      </div>
    </div>
  }
  <!-- Contenu du site : bloqué (souris et clavier) tant que la mise à jour n'est pas faite.
       En-tête fixe ; la page occupe tout l'espace restant et le pied de page vient après elle (styles.scss, « coque de l'application »). -->
  <div class="app-content" [attr.inert]="updateAvailable ? '' : null" [attr.aria-hidden]="updateAvailable ? 'true' : null">
    <app-header/>
    <app-wave-bar/>
    <app-closed-wave-banner/>
    <router-outlet></router-outlet>
    <app-footer/>
  </div>
</div>
