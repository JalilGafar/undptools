<!-- Retour -->
<button class="btn btn-outline-secondary btn-sm m-3" (click)="goBack()">
    ← Retour
</button>

@if ((state$ | async)?.loading) {
    <app-loading message="Chargement…" />
} @else if ((state$ | async)?.error) {
    <app-load-error message="Impossible de charger les entreprises." />
} @else if (companies$ |async; as data) {
    @for (item of data; track $index) {
        <ul>
            <li> {{item.name}} </li>
        </ul>
    }
}
