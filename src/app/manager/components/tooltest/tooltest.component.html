<div class="container tt-wrapper">

  <button type="button" class="btn btn-outline-secondary btn-sm mb-3" (click)="goBack()">
    <i class="bi bi-arrow-left me-1"></i> Retour
  </button>

  <header class="tt-header">
    <div class="tt-header-icon"><i class="bi bi-grid-3x3-gap-fill"></i></div>
    <div>
      <h1 class="tt-title">Bibliothèque des outils GYB</h1>
      <p class="tt-sub">Ouvrez un outil tel que le voit un consultant. Il s'affiche vierge et vous pouvez le remplir pour juger sa qualité : rien n'est enregistré.</p>
    </div>
  </header>

  @for (g of groups; track g.label; let i = $index) {
    <section class="tt-group" [class.tt-group-soon]="g.activeCount === 0">
      <button type="button" class="tt-group-head" (click)="toggle(g)" [attr.aria-expanded]="g.open">
        <i class="bi {{ g.icon }} tt-group-icon"></i>
        <span class="tt-group-title">
          @if (i > 0) { <small class="tt-group-eyebrow">Étape {{ i }}</small> }
          {{ g.label }}
        </span>
        <span class="tt-count">{{ g.activeCount }} outil{{ g.activeCount > 1 ? 's' : '' }}</span>
        <i class="bi" [class.bi-chevron-up]="g.open" [class.bi-chevron-down]="!g.open"></i>
      </button>

      @if (g.open) {
        <div class="tt-tools">
          @for (t of g.tools; track t.route + t.label) {
            <button type="button" class="tt-tool" [class.soon]="t.status === 'soon'" (click)="open(t)">
              @if (t.code) { <span class="tt-code">{{ t.code }}</span> }
              <span class="tt-tool-name">{{ t.name }}</span>
              @if (t.status === 'active') { <span class="tt-chip">Disponible</span> }
              @else { <span class="tt-chip soon">Bientôt</span> }
              <i class="bi bi-chevron-right tt-go"></i>
            </button>
          }
        </div>
      }
    </section>
  }
</div>
